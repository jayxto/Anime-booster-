<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Boosters</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="logo">🎴 Anime <b>Boosters</b></div>
  <nav>
    <button data-tab="shop" class="on">Boosters</button>
    <button data-tab="binder">Classeur</button>
    <button data-tab="stats">Stats</button>
  </nav>
  <div class="wallet"><span id="coins">0</span> 🪙</div>
</header>

<main>
  <section id="tab-shop" class="tab on">
    <div class="infinite" id="infinite">
      <div class="inf-txt">
        <div class="inf-t">♾️ Pack Infini</div>
        <div class="inf-d">Gratuit, sans limite. Ouvre autant de packs que tu veux.</div>
      </div>
      <button class="btn gold big">Ouvrir</button>
    </div>
    <div class="row2">
      <div class="free">
        <div><h2>Booster gratuit</h2><p id="free-txt">…</p></div>
        <button id="free-btn" class="btn">Ouvrir</button>
      </div>
      <div class="free">
        <div><h2>Cadeau du jour</h2><p id="daily-txt">…</p></div>
        <button id="daily-btn" class="btn">Récupérer</button>
      </div>
    </div>
    <h2 class="sec">Boosters</h2>
    <div id="packs" class="packs"></div>
    <h2 class="sec">Boosters par animé <small id="anime-count"></small></h2>
    <input id="anime-search" class="search" placeholder="Chercher un animé…">
    <div id="anime-packs" class="packs small"></div>
    <button id="anime-more" class="btn more">Voir plus</button>
  </section>

  <section id="tab-binder" class="tab">
    <div class="lib-bar">
      <input id="lib-search" class="search" placeholder="Chercher un classeur…">
      <select id="lib-sort">
        <option value="owned">Les plus remplis</option>
        <option value="pop">Les plus populaires</option>
        <option value="az">A → Z</option>
      </select>
    </div>
    <p id="lib-prog" class="prog"></p>
    <div id="library" class="library"></div>
    <button id="lib-more" class="btn more">Voir plus</button>
  </section>

  <section id="tab-stats" class="tab">
    <div id="stats"></div>
    <h2 class="sec">Taux de drop</h2>
    <div id="rates"></div>
    <button id="reset" class="btn danger">Réinitialiser ma partie</button>
  </section>
</main>

<div id="opening" class="opening">
  <div class="op-head" id="op-count"></div>
  <div class="op-pack" id="op-pack"><div class="op-art" id="op-art"></div><div class="op-tear"></div><div class="op-name" id="op-name"></div></div>
  <div class="op-god" id="op-god">✨ GOD PACK ✨</div>
  <div class="op-cards" id="op-cards"></div>
  <div class="op-bar">
    <button id="op-flip" class="btn">Tout retourner</button>
    <button id="op-again" class="btn gold">Pack suivant</button>
    <button id="op-auto" class="btn">▶ Auto</button>
    <button id="op-close" class="btn">Fermer</button>
  </div>
  <p class="op-hint">Espace = pack suivant · Échap = fermer</p>
</div>

<div id="book" class="book">
  <div class="book-top">
    <button id="book-close" class="btn">✕</button>
    <div class="book-title" id="book-title"></div>
    <div class="book-prog" id="book-prog"></div>
  </div>
  <div class="book-stage" id="book-stage"></div>
  <div class="book-nav">
    <button id="book-first" class="btn">⏮</button>
    <button id="book-prev" class="btn">◀</button>
    <span id="book-page"></span>
    <button id="book-next" class="btn">▶</button>
    <button id="book-last" class="btn">⏭</button>
  </div>
</div>

<div id="zoom" class="zoom"></div>
<div id="toast" class="toast"></div>
<script src="vendor/page-flip.browser.js"></script>
<script src="game.js"></script>
</body>
</html>
